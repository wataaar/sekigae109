<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラス席替えジェネレーター</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --seat-bg: #ffffff;
      --seat-border: #cbd5e1;
      --seat-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --empty-bg: #f1f5f9;
      --empty-border: #94a3b8;
      --chalk-bg: linear-gradient(180deg, #1e3a2b 0%, #11251c 100%);
      --chalk-border: #6c4e31;
    }

    [data-theme="dark"] {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(51, 65, 85, 0.8);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #818cf8;
      --primary-hover: #6366f1;
      --seat-bg: #1e293b;
      --seat-border: #334155;
      --seat-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      --empty-bg: #0f172a;
      --empty-border: #475569;
      --chalk-bg: linear-gradient(180deg, #0d1b13 0%, #07100b 100%);
      --chalk-border: #4a3420;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Zen Kaku Gothic New', 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
      width: 100%;
      max-width: 960px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, var(--primary) 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--seat-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: var(--seat-shadow);
      transition: transform 0.2s;
    }

    .theme-toggle:hover { transform: scale(1.05); }

    .main-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 32px;
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .board-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 32px;
    }

    .chalkboard {
      background: var(--chalk-bg);
      border: 6px solid var(--chalk-border);
      border-radius: 10px;
      padding: 12px 0;
      text-align: center;
      color: #e2e8f0;
      font-weight: 900;
      letter-spacing: 0.4em;
      font-size: 1rem;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2), inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .grid-wrapper {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(7, minmax(85px, 1fr));
      gap: 12px;
      width: 100%;
      min-width: 650px;
    }

    .seat {
      background: var(--seat-bg);
      border: 2px solid var(--seat-border);
      border-radius: 16px;
      aspect-ratio: 1.1 / 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: var(--seat-shadow);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s;
    }

    .seat:not(.empty):hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .seat-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .student-number {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-main);
      transition: transform 0.2s ease;
    }

    .unit {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .seat.empty {
      background: var(--empty-bg);
      border: 2px dashed var(--empty-border);
      opacity: 0.8;
      box-shadow: none;
    }

    .empty-text {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .seat.shuffling {
      animation: pulseSeat 0.15s infinite alternate;
      border-color: var(--primary);
    }

    @keyframes pulseSeat {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); background-color: rgba(99, 102, 241, 0.1); }
    }

    .seat.revealed {
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIn {
      0% { transform: scale(0.85); opacity: 0.5; }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    .controls {
      margin-top: 36px;
      display: flex;
      gap: 16px;
      justify-content: center;
      width: 100%;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 800;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }

    .btn-secondary {
      background: var(--seat-bg);
      color: var(--text-main);
      border: 2px solid var(--seat-border);
      box-shadow: var(--seat-shadow);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(0,0,0,0.03);
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    @media (max-width: 720px) {
      body { padding: 12px 6px; }
      .main-card { padding: 16px 10px; }
      h1 { font-size: 1.6rem; }
      .theme-toggle { position: static; margin-bottom: 12px; }
      header { display: flex; flex-direction: column; align-items: center; }
    }

    @media print {
      body { background: white; color: black; padding: 0; }
      .main-card { border: none; box-shadow: none; background: white; padding: 0; max-width: 100%; }
      .controls, .theme-toggle { display: none; }
      .chalkboard { background: white; color: black; border: 2px solid black; box-shadow: none; }
      .seat { box-shadow: none; border: 1.5px solid black; background: white !important; }
      .student-number { color: black !important; }
    }
  </style>
</head>
<body>
  <header>
    <button class="theme-toggle" id="themeToggleBtn">ダークモード</button>
    <h1>クラス席替えジェネレーター</h1>
    <p class="subtitle">全40名 / 横7列 × 縦6列 (後ろの端2席があきます)</p>
  </header>

  <main class="main-card">
    <div class="board-container">
      <div class="chalkboard">黒 板 (前)</div>
    </div>

    <div class="grid-wrapper">
      <div class="grid-container" id="seatingGrid"></div>
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="shuffleBtn">
        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        席替えをスタート！
      </button>

      <button class="btn btn-secondary" id="printBtn" type="button">
        <svg class="btn-icon" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
        印刷・PDF保存
      </button>
    </div>
  </main>

  <script>
    const AudioFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
      },
      playTick() {
        try {
          this.init();
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.03, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.05);
        } catch (e) {}
      },
      playTada() {
        try {
          this.init();
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.1, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.4);
          });
        } catch (e) {}
      }
    };

    const COLS = 7;
    const ROWS = 6;
    const TOTAL_SEATS = COLS * ROWS;
    const TOTAL_STUDENTS = 40;
    const EMPTY_INDICES = [35, 41];

    const seatingGrid = document.getElementById('seatingGrid');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const themeToggleBtn = document.getElementById('themeToggleBtn');

    function initGrid() {
      seatingGrid.innerHTML = '';
      for (let i = 0; i < TOTAL_SEATS; i++) {
        const row = Math.floor(i / COLS) + 1;
        const col = (i % COLS) + 1;

        const seat = document.createElement('div');
        seat.className = 'seat';
        seat.id = `seat-${i}`;

        if (EMPTY_INDICES.includes(i)) {
          seat.classList.add('empty');
          seat.innerHTML = `
            <span class="seat-label">${row}-${col}</span>
            <span class="empty-text">空席</span>
          `;
        } else {
          seat.innerHTML = `
            <span class="seat-label">${row}-${col}</span>
            <div style="display:flex; align-items:baseline; gap:2px;">
              <span class="student-number" id="num-${i}">-</span>
              <span class="unit">番</span>
            </div>
          `;
        }
        seatingGrid.appendChild(seat);
      }
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function runShuffleAnimation() {
      const students = Array.from({ length: TOTAL_STUDENTS }, (_, i) => i + 1);
      const shuffledStudents = shuffle(students);
      shuffleBtn.disabled = true;

      const activeIndices = [];
      for (let i = 0; i < TOTAL_SEATS; i++) {
        if (!EMPTY_INDICES.includes(i)) {
          const el = document.getElementById(`seat-${i}`);
          el.classList.add('shuffling');
          el.classList.remove('revealed');
          activeIndices.push(i);
        }
      }

      let count = 0;
      const maxTicks = 22;
      const interval = setInterval(() => {
        const tempStudents = shuffle(students);
        let tIdx = 0;
        activeIndices.forEach(idx => {
          document.getElementById(`num-${idx}`).innerText = tempStudents[tIdx];
          tIdx++;
        });
        AudioFX.playTick();
        count++;

        if (count >= maxTicks) {
          clearInterval(interval);
          let resIdx = 0;
          activeIndices.forEach(idx => {
            const seatEl = document.getElementById(`seat-${idx}`);
            const numEl = document.getElementById(`num-${idx}`);
            numEl.innerText = shuffledStudents[resIdx];
            seatEl.classList.remove('shuffling');
            seatEl.classList.add('revealed');
            resIdx++;
          });

          AudioFX.playTada();
          shuffleBtn.disabled = false;

          if (typeof confetti === 'function') {
            confetti({
              particleCount: 80,
              spread: 70,
              origin: { y: 0.75 },
              colors: ['#6366f1', '#a855f7', '#ec4899', '#3b82f6']
            });
          }
        }
      }, 50);
    }

    themeToggleBtn.addEventListener('click', () => {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        html.setAttribute('data-theme', 'light');
        themeToggleBtn.innerText = 'ダークモード';
      } else {
        html.setAttribute('data-theme', 'dark');
        themeToggleBtn.innerText = 'ライトモード';
      }
    });

    document.getElementById('printBtn').addEventListener('click', () => window.print());
    initGrid();
    shuffleBtn.addEventListener('click', runShuffleAnimation);
  </script>
</body>
</html>
